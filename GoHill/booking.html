<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Book Your Trip - GoHill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="logo">Go<span>Hill</span></div>
    <span class="header-spacer"></span>
  </header>

  <main class="booking-main">

    <!-- STAGE 1: Mode Selection -->
    <section class="stage" id="stage1">
      <h2 class="stage-title">Travel Style </h2>
      <p class="stage-sub">Kaise ghumna chahoge Kumaon mein?</p>

      <div class="mode-cards">
        <button class="mode-card mode-raw" data-mode="raw">
          <span class="mode-badge">RAW</span>
          <h3>Spend your time like th Local ones </h3>
          <ul>
            <li>Our team members are friendly with you like your friend </li>
            <li>Cultural style home stays with locals </li>
            <li>Culture experience</li>
          </ul>
        </button>

        <button class="mode-card mode-classic" data-mode="classic">
          <span class="mode-badge">CLASSIC</span>
          <h3>Tourist style</h3>
          <ul>
            <li>Comfortable hotel stay</li>
            <li>Professional tour guide</li>
            <li>Planned aur easy</li>
          </ul>
        </button>
      </div>

      <label class="wfh-toggle">
        <input type="checkbox" id="wfhCheckbox">
        <span class="wfh-box"></span>
        <span class="wfh-text">Work From Hill bhi chahiye? <small>(WiFi + workspace setup)</small></span>
      </label>

      <button class="continue-btn" id="continueBtn" disabled>Continue</button>
    </section>

    <!-- STAGE 2: Details Form -->
    <section class="stage stage-hidden" id="stage2">

      <div class="selected-mode-chip" id="selectedModeChip"></div>

      <form id="bookingForm" class="booking-form">

        <label class="form-label">Destination</label>
        <select class="form-input" id="destinationSelect" required>
          <option value="" disabled>Select district</option>
        </select>

        <label class="form-label">Name</label>
        <input class="form-input" type="text" id="nameInput" placeholder="Apna naam likho" required>

        <label class="form-label">Mobile Number</label>
        <input class="form-input" type="tel" id="mobileInput" placeholder="10-digit mobile number" maxlength="10" required>

        <label class="form-label">Number of Days</label>
        <div class="stepper">
          <button type="button" class="stepper-btn" id="daysMinus">−</button>
          <span class="stepper-value" id="daysValue">1</span>
          <button type="button" class="stepper-btn" id="daysPlus">+</button>
        </div>

        <label class="form-label">Adventure Sports <small>(optional)</small></label>
        <div class="activities-list" id="activitiesList">
          <!-- JS se fill hoga -->
        </div>

        <button type="submit" class="submit-btn">Confirm Booking</button>
      </form>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="connect.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span>Connect</span>
    </a>

    <a href="booking.html" class="nav-item nav-center">
      <span class="nav-center-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <span>Book</span>
    </a>

    <a href="notification.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span>Alerts</span>
    </a>
  </nav>

</div>

<script src="js/districts.js"></script>
<script src="js/activities.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
