<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Profile - GoHill</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4B3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="logo">Go<span>Hill</span></div>
    <span class="header-spacer"></span>
  </header>

  <main class="profile-main">

    <div class="profile-hero">
      <div class="profile-badge">
        <span class="badge-text">Go<br>Hill</span>
      </div>
      <p class="profile-tagline">Explore the World,<br>Live Your Life in Hills</p>
    </div>

    <div class="profile-field">
      <label class="form-label">Name</label>
      <div class="field-row">
        <input class="form-input" type="text" id="profileName" placeholder="Apna naam likho">
        <button class="save-tick-btn" id="saveName" aria-label="Save name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
      <span class="save-status" id="nameStatus"></span>
    </div>

    <div class="profile-field">
      <label class="form-label">Mobile Number</label>
      <div class="field-row">
        <input class="form-input" type="tel" id="profileMobile" placeholder="10-digit mobile number" maxlength="10">
        <button class="save-tick-btn" id="saveMobile" aria-label="Save mobile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
      <span class="save-status" id="mobileStatus"></span>
    </div>

    <div class="profile-field">
      <label class="form-label">Preferred Type</label>
      <div class="field-row">
        <div class="pref-chips">
          <button type="button" class="pref-chip" data-pref="wfh">Work From Hills</button>
          <button type="button" class="pref-chip" data-pref="adventure">Adventure Sports</button>
        </div>
        <button class="save-tick-btn" id="savePref" aria-label="Save preference">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
      <span class="save-status" id="prefStatus"></span>
    </div>

    <div class="profile-field">
      <label class="form-label">Request PWA</label>
      <button class="pwa-install-btn" id="pwaInstallBtn">Install GoHill App</button>
      <span class="save-status" id="pwaStatus"></span>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="connect.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span>Connect</span>
    </a>

    <a href="booking.html" class="nav-item nav-center">
      <span class="nav-center-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <span>Book</span>
    </a>

    <a href="notification.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span>Alerts</span>
    </a>
  </nav>

</div>

<script src="js/pwa-register.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
