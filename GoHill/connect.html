<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Connect - GoHill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="logo">Go<span>Hill</span></div>
    <span class="header-spacer"></span>
  </header>

  <main class="connect-main">
    <h2 class="stage-title">Humse Judo</h2>
    <p class="stage-sub">Koi bhi sawaal ho, humari team seedha WhatsApp pe reply karegi</p>

    <form id="connectForm" class="booking-form">

      <label class="form-label">Name</label>
      <input class="form-input" type="text" id="connectName" placeholder="Apna naam likho" required>

      <label class="form-label">Mobile Number</label>
      <input class="form-input" type="tel" id="connectMobile" placeholder="10-digit mobile number" maxlength="10" required>

      <label class="form-label">Query / Description</label>
      <textarea class="form-input textarea-input" id="connectQuery" rows="4" placeholder="Apna sawaal ya jaankari yahan likho..." required></textarea>

      <button type="submit" class="submit-btn whatsapp-btn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12.004 2C6.486 2 2.01 6.476 2.01 11.994c0 2.11.579 4.09 1.588 5.79L2 22l4.362-1.548a10.06 10.06 0 0 0 5.642 1.686h.004c5.518 0 9.994-4.476 9.994-9.994C21.998 6.476 17.522 2 12.004 2zm5.792 15.782c-.68.68-1.579 1.098-2.556 1.253-1.157.181-2.417.093-3.72-.393-2.48-.933-4.532-2.925-5.61-4.66-.57-.916-1.19-2.11-1.19-3.988 0-1.878 1.068-2.777 1.443-3.152.375-.375.816-.469 1.09-.469.272 0 .544.002.782.014.25.012.585-.095.914.696.34.816.916 2.279.994 2.446.079.166.13.36.026.578-.104.219-.156.354-.312.545-.157.192-.33.428-.47.575-.157.166-.32.346-.138.68.183.331.815 1.346 1.75 2.181 1.203 1.073 2.217 1.406 2.548 1.564.331.157.522.131.714-.079.192-.209.822-.958.041-1.163.09-.293.36-.246.61-.148.25.098 1.593.752 1.867.889.273.136.454.203.522.317.068.114.068.66-.612 1.34z"/>
        </svg>
        Raise a Query
      </button>
    </form>
  </main>

  <nav class="bottom-nav">
    <a href="connect.html" class="nav-item active-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span>Connect</span>
    </a>

    <a href="booking.html" class="nav-item nav-center">
      <span class="nav-center-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <span>Book</span>
    </a>

    <a href="notification.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span>Alerts</span>
    </a>
  </nav>

</div>

<script src="js/connect.js"></script>
</body>
</html>
